<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Enterprise Support Desk</title>
</head>
<body>

    <h1>Enterprise IT Support Desk</h1>
    <p>Please fill out the form below to submit a support ticket. All required fields are marked with an asterisk (*).</p>

    <form action="/submit-ticket" method="POST" enctype="multipart/form-data">
        
        <fieldset>
            <legend>Employee Details</legend>
            <label for="fullName">Full Name *:</label>
            <input type="text" id="fullName" name="fullName" required minlength="3" maxlength="50"><br><br>

            <label for="empId">Employee ID (e.g., EMP-1234) *:</label>
            <input type="text" id="empId" name="empId" required pattern="^EMP-\d{4}$" title="Format: EMP- followed by 4 digits"><br><br>

            <label for="email">Corporate Email *:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="department">Department:</label>
            <select id="department" name="department">
                <option value="engineering">Engineering</option>
                <option value="hr">Human Resources</option>
                <option value="sales">Sales</option>
                <option value="finance">Finance</option>
            </select>
        </fieldset>
        <br>

        <fieldset>
            <legend>Issue Details</legend>
            <label for="priority">Priority Level:</label>
            <input type="radio" id="low" name="priority" value="low" checked>
            <label for="low">Low</label>
            <input type="radio" id="medium" name="priority" value="medium">
            <label for="medium">Medium</label>
            <input type="radio" id="high" name="priority" value="high">
            <label for="high">High</label><br><br>

            <label for="issueType">Issue Category:</label>
            <input type="text" id="issueType" name="issueType" list="categories" required>
            <datalist id="categories">
                <option value="Hardware Failure">
                <option value="Software Bug">
                <option value="Access Request">
                <option value="Network Outage">
            </datalist><br><br>

            <label for="description">Detailed Description *:</label><br>
            <textarea id="description" name="description" rows="6" cols="50" required placeholder="Describe the problem, steps to reproduce, and any error codes..."></textarea>
        </fieldset>
        <br>

        <fieldset>
            <legend>Attachments & Evidence</legend>
            <label for="screenshot">Upload Screenshot or Log File (Max 5MB):</label>
            <input type="file" id="screenshot" name="screenshot" accept=".png, .jpg, .txt, .pdf, .log" multiple>
        </fieldset>
        <br>

        <button type="submit">Submit Ticket</button>
        <button type="reset">Clear Form</button>

    </form>

</body>
</html>
